<style id="$mol_style_attach:mol/theme/theme.css">:root {
	--mol_theme_hue: 240deg;
	--mol_theme_hue_spread: 90deg;
	color-scheme: dark light;
}

body, :where([mol_theme]) {
	color: var(--mol_theme_text);
	fill: var(--mol_theme_text);
	background-color: var(--mol_theme_back);
}
	
:root, [mol_theme="$mol_theme_dark"], :where([mol_theme="$mol_theme_dark"]) [mol_theme]  {

	--mol_theme_luma: -1;
	--mol_theme_image: invert(1) hue-rotate( 180deg );
	--mol_theme_spirit: hsl( 0deg, 0%, 0%, .75 );

	--mol_theme_back: hsl( var(--mol_theme_hue), 20%, 10% );
	--mol_theme_card: hsl( var(--mol_theme_hue), 50%, 20%, .25 );
	--mol_theme_field: hsl( var(--mol_theme_hue), 50%, 8%, .25 );
	--mol_theme_hover: hsl( var(--mol_theme_hue), 0%, 50%, .1 );
	
	--mol_theme_text: hsl( var(--mol_theme_hue), 0%, 80% );
	--mol_theme_shade: hsl( var(--mol_theme_hue), 0%, 60%, 1 );
	--mol_theme_line: hsl( var(--mol_theme_hue), 0%, 50%, .25 );
	--mol_theme_focus: hsl( calc( var(--mol_theme_hue) + 180deg ), 100%, 65% );
	
	--mol_theme_control: hsl( var(--mol_theme_hue), 60%, 65% );
	--mol_theme_current: hsl( calc( var(--mol_theme_hue) - var(--mol_theme_hue_spread) ), 60%, 65% );
	--mol_theme_special: hsl( calc( var(--mol_theme_hue) + var(--mol_theme_hue_spread) ), 60%, 65% );

} @supports( color: oklch( 0% 0 0deg ) ) {
:root, [mol_theme="$mol_theme_dark"], :where([mol_theme="$mol_theme_dark"]) [mol_theme]  {
	
	--mol_theme_back: oklch( 20% .03 var(--mol_theme_hue) );
	--mol_theme_card: oklch( 30% .05 var(--mol_theme_hue) / .25 );
	--mol_theme_field: oklch( 15% 0 var(--mol_theme_hue) / .25 );
	--mol_theme_hover: oklch( 70% 0 var(--mol_theme_hue) / .1 );
	
	--mol_theme_text: oklch( 80% 0 var(--mol_theme_hue) );
	--mol_theme_shade: oklch( 60% 0 var(--mol_theme_hue) );
	--mol_theme_line: oklch( 60% 0 var(--mol_theme_hue) / .25 );
	--mol_theme_focus: oklch( 80% .2 calc( var(--mol_theme_hue) + 180deg ) );
	
	--mol_theme_control: oklch( 70% .1 var(--mol_theme_hue) );
	--mol_theme_current: oklch( 70% .2 calc( var(--mol_theme_hue) - var(--mol_theme_hue_spread) ) );
	--mol_theme_special: oklch( 70% .2 calc( var(--mol_theme_hue) + var(--mol_theme_hue_spread) ) );

} }

[mol_theme="$mol_theme_light"], :where([mol_theme="$mol_theme_light"]) [mol_theme] {
	
	--mol_theme_luma: 1;
	--mol_theme_image: none;
	--mol_theme_spirit: hsl( 0deg, 0%, 100%, .75 );
	
	--mol_theme_back: hsl( var(--mol_theme_hue), 20%, 92% );
	--mol_theme_card: hsl( var(--mol_theme_hue), 50%, 100%, .5 );
	--mol_theme_field: hsl( var(--mol_theme_hue), 50%, 100%, .75 );
	--mol_theme_hover: hsl( var(--mol_theme_hue), 0%, 50%, .1 );
	
	--mol_theme_text: hsl( var(--mol_theme_hue), 0%, 0% );
	--mol_theme_shade: hsl( var(--mol_theme_hue), 0%, 40%, 1 );
	--mol_theme_line: hsl( var(--mol_theme_hue), 0%, 50%, .25 );
	--mol_theme_focus: hsl( calc( var(--mol_theme_hue) + 180deg ), 100%, 40% );
	
	--mol_theme_control: hsl( var(--mol_theme_hue), 80%, 30% );
	--mol_theme_current: hsl( calc( var(--mol_theme_hue) - var(--mol_theme_hue_spread) ), 80%, 30% );
	--mol_theme_special: hsl( calc( var(--mol_theme_hue) + var(--mol_theme_hue_spread) ), 80%, 30% );

} @supports( color: oklch( 0% 0 0deg ) ) {
[mol_theme="$mol_theme_light"], :where([mol_theme="$mol_theme_light"]) [mol_theme] {
	--mol_theme_back: oklch( 92% .01 var(--mol_theme_hue) );
	--mol_theme_card: oklch( 99% .01 var(--mol_theme_hue) / .5 );
	--mol_theme_field: oklch( 100% 0 var(--mol_theme_hue) / .5 );
	--mol_theme_hover: oklch( 50% 0 var(--mol_theme_hue) / .1 );
	
	--mol_theme_text: oklch( 20% 0 var(--mol_theme_hue) );
	--mol_theme_shade: oklch( 60% 0 var(--mol_theme_hue) );
	--mol_theme_line: oklch( 50% 0 var(--mol_theme_hue) / .25 );
	--mol_theme_focus: oklch( 60% .2 calc( var(--mol_theme_hue) + 180deg ) );
	
	--mol_theme_control: oklch( 40% .15 var(--mol_theme_hue) );
	--mol_theme_current: oklch( 50% .2 calc( var(--mol_theme_hue) - var(--mol_theme_hue_spread) ) );
	--mol_theme_special: oklch( 50% .2 calc( var(--mol_theme_hue) + var(--mol_theme_hue_spread) ) );

} }

:where( :root, [mol_theme="$mol_theme_dark"] ) [mol_theme="$mol_theme_base"] {
	--mol_theme_back: oklch( 25% .075 var(--mol_theme_hue) );
	--mol_theme_card: oklch( 35% .1 var(--mol_theme_hue) / .25 );
}
:where( [mol_theme="$mol_theme_light"] ) [mol_theme="$mol_theme_base"] {
	--mol_theme_back: oklch( 85% .075 var(--mol_theme_hue) );
	--mol_theme_card: oklch( 98% .03 var(--mol_theme_hue) / .25 );
}

:where( :root, [mol_theme="$mol_theme_dark"] ) [mol_theme="$mol_theme_current"] {
	--mol_theme_back: oklch( 25% .05 calc( var(--mol_theme_hue) - var(--mol_theme_hue_spread) ) );
	--mol_theme_card: oklch( 35% .1 calc( var(--mol_theme_hue) - var(--mol_theme_hue_spread) ) / .25 );
}
:where( [mol_theme="$mol_theme_light"] ) [mol_theme="$mol_theme_current"] {
	--mol_theme_back: oklch( 85% .05 calc( var(--mol_theme_hue) - var(--mol_theme_hue_spread) ) );
	--mol_theme_card: oklch( 98% .03 calc( var(--mol_theme_hue) - var(--mol_theme_hue_spread) ) / .25 );
}

:where( :root, [mol_theme="$mol_theme_dark"] ) [mol_theme="$mol_theme_special"] {
	--mol_theme_back: oklch( 25% .05 calc( var(--mol_theme_hue) + var(--mol_theme_hue_spread) ) );
	--mol_theme_card: oklch( 35% .1 calc( var(--mol_theme_hue) + var(--mol_theme_hue_spread) ) / .25 );
}
:where( [mol_theme="$mol_theme_light"] ) [mol_theme="$mol_theme_special"] {
	--mol_theme_back: oklch( 85% .05 calc( var(--mol_theme_hue) + var(--mol_theme_hue_spread) ) );
	--mol_theme_card: oklch( 98% .03 calc( var(--mol_theme_hue) + var(--mol_theme_hue_spread) ) / .25 );
}

:where( :root, [mol_theme="$mol_theme_dark"] ) [mol_theme="$mol_theme_accent"] {
	--mol_theme_back: oklch( 35% .1 calc( var(--mol_theme_hue) + 180deg ) );
	--mol_theme_card: oklch( 45% .15 calc( var(--mol_theme_hue) + 180deg ) / .25 );
}
:where( [mol_theme="$mol_theme_light"] ) [mol_theme="$mol_theme_accent"] {
	--mol_theme_back: oklch( 83% .1 calc( var(--mol_theme_hue) + 180deg ) );
	--mol_theme_card: oklch( 98% .03 calc( var(--mol_theme_hue) + 180deg ) / .25 );
}

</style><style id="$mol_style_attach:mol/gap/gap.css">:root {
	--mol_gap_page: 3rem;
	--mol_gap_block: .75rem;
	--mol_gap_text: .5rem .75rem;
	--mol_gap_emoji: .5rem;

</style><style id="$mol_style_attach:mol/view/view/view.css">@view-transition {
	navigation: auto;
}

[mol_view] {
	transition-property: height, width, min-height, min-width, max-width, max-height, transform, scale, translate, rotate;
	transition-duration: .2s;
	transition-timing-function: ease-out;
	-webkit-appearance: none;
	box-sizing: border-box;
	display: flex;
	flex-shrink: 0;
	contain: style;
	scrollbar-color: var(--mol_theme_line) transparent;
	scrollbar-width: thin;
	text-wrap-style: pretty;
}	

[mol_view]::selection {
	background: var(--mol_theme_line);
}	

[mol_view]::-webkit-scrollbar {
	width: .25rem;
	height: .25rem;
}

[mol_view]::-webkit-scrollbar-corner {
	background-color: var(--mol_theme_line);
}

[mol_view]::-webkit-scrollbar-track {
	background-color: transparent;
}

[mol_view]::-webkit-scrollbar-thumb {
	background-color: var(--mol_theme_line);
	border-radius: var(--mol_gap_round);
}

[mol_view] > * {
	word-break: inherit;
}

[mol_view_root] {
	margin: 0;
	padding: 0;
	width: 100%;
	height: 100%;
	box-sizing: border-box;
	font-family: system-ui, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	font-size: 1rem;
	line-height: 1.5rem;
	/* background: var(--mol_theme_back);
	color: var(--mol_theme_text); */
	contain: unset; /** Fixes bg ignoring when applied to body on Chrome */
	tab-size: 4;
	/*overscroll-behavior: contain; /** Disable navigation gestures **/
}

@media print {
	[mol_view_root] {
		height: auto;
	}
}
[mol_view][mol_view_error]:not([mol_view_error="Promise"], [mol_view_error="$mol_promise_blocker"]) {
	background-image: repeating-linear-gradient(
		-45deg,
		#f92323,
		#f92323 .5rem,
		#ff3d3d .5rem,
		#ff3d3d 1.5rem
	);
	color: black;
	align-items: center;
	justify-content: center;
}

@keyframes mol_view_wait {
	from {
		opacity: .25;
	}
	20% {
		opacity: .75;
	}
	to {
		opacity: .25;
	}
}

:where([mol_view][mol_view_error="$mol_promise_blocker"]),
:where([mol_view][mol_view_error="Promise"]) {
	background: var(--mol_theme_hover);
}

[mol_view][mol_view_error="Promise"] {
	animation: mol_view_wait 1s steps(20,end) infinite;
}
</style><style id="$mol_style_attach:$mol_scroll">[mol_scroll] {

	overflow: auto;
	flex-direction: column;
	flex-grow: 1;
	flex-shrink: 1;
	outline: none;
	align-self: stretch;
	align-items: flex-start;
	box-sizing: border-box;
	will-change: scroll-position;
	scroll-padding: 0.75rem 0;
	max-height: 100%;
	max-width: 100%;
	webkit-overflow-scrolling: touch;
	contain: content;
}
[mol_scroll] > :where([mol_view]) {
	grid-area: 1/1;
}
[mol_scroll]::before {
	display: none;
}
[mol_scroll]::after {

}
[mol_scroll]::-webkit-scrollbar {

@media print {

</style><style id="$mol_style_attach:bog/theme/theme.css">:root {

	--mol_theme_accent_hue: calc(var(--mol_theme_hue) + 180deg);

	--bog_theme_current: hsl(calc(var(--bog_theme_hue) - var(--bog_theme_hue_spread)), 25%, 70%);
	--bog_theme_special: hsl(calc(var(--bog_theme_hue) + var(--bog_theme_hue_spread)), 25%, 70%);

/* ═══════════════════════════════════════════════════════════════
   Calm theme — universal working theme (draft for review)
   Base hue: 230° (blue-gray), spread: 90°
   Style: quiet, professional, no noise
   ═══════════════════════════════════════════════════════════════ */

/* Calm dark theme */
[mol_theme='$mol_theme_calm_dark'],
:where([mol_theme='$mol_theme_calm_dark']) [mol_theme] {
	--mol_theme_luma: -1;
	--mol_theme_image: invert(1) hue-rotate(180deg);
	--mol_theme_spirit: #000000bf;
	--mol_theme_hue: 230deg;
	--mol_theme_hue_spread: 90deg;

	--mol_theme_back: #0d1117;
	--mol_theme_card: #161b2240;
	--mol_theme_field: #0a0e1440;
	--mol_theme_hover: #ffffff0c;

	--mol_theme_text: #e6edf3;
	--mol_theme_shade: #8b949e;
	--mol_theme_line: #30363d;
	--mol_theme_focus: #d29922;

	--mol_theme_control: #2f81f7;
	--mol_theme_current: #3fb950;
	--mol_theme_special: #a371f7;
}

/* Calm light theme */
[mol_theme='$mol_theme_calm_light'],
:where([mol_theme='$mol_theme_calm_light']) [mol_theme] {
	--mol_theme_luma: 1;
	--mol_theme_image: none;
	--mol_theme_spirit: #f7f8fabf;
	--mol_theme_hue: 230deg;
	--mol_theme_hue_spread: 90deg;

	--mol_theme_back: #f7f8fa;
	--mol_theme_card: #ffffff80;
	--mol_theme_field: #e8eaf0bf;
	--mol_theme_hover: #0000000a;

	--mol_theme_text: #1a1c23;
	--mol_theme_shade: #656a80;
	--mol_theme_line: #3a3e5026;
	--mol_theme_focus: #b87518;

	--mol_theme_control: #3560b8;
	--mol_theme_current: #28856e;
	--mol_theme_special: #8a4aad;
}

/* Calm dark sub-themes */
:where([mol_theme='$mol_theme_calm_dark']) [mol_theme='$mol_theme_base'] {
	--mol_theme_back: #1a2840;
	--mol_theme_card: #243450;
}
:where([mol_theme='$mol_theme_calm_dark']) [mol_theme='$mol_theme_current'] {
	--mol_theme_back: #143028;
	--mol_theme_card: #1c3e3450;

:where([mol_theme='$mol_theme_calm_dark']) [mol_theme='$mol_theme_special'] {

}
:where([mol_theme='$mol_theme_calm_dark']) [mol_theme='$mol_theme_accent'] {

}

:where([mol_theme='$mol_theme_calm_light']) [mol_theme='$mol_theme_base'] {
	--mol_theme_back: oklch(85% 0.075 var(--mol_theme_hue));
	--mol_theme_card: oklch(98% 0.03 var(--mol_theme_hue) / 0.25);
}
:where([mol_theme='$mol_theme_calm_light']) [mol_theme='$mol_theme_current'] {
	--mol_theme_back: oklch(85% 0.05 calc(var(--mol_theme_hue) - var(--mol_theme_hue_spread)));
	--mol_theme_card: oklch(98% 0.03 calc(var(--mol_theme_hue) - var(--mol_theme_hue_spread)) / 0.25);
}
:where([mol_theme='$mol_theme_calm_light']) [mol_theme='$mol_theme_special'] {
	--mol_theme_back: oklch(85% 0.05 calc(var(--mol_theme_hue) + var(--mol_theme_hue_spread)));
	--mol_theme_card: oklch(98% 0.03 calc(var(--mol_theme_hue) + var(--mol_theme_hue_spread)) / 0.25);
}
:where([mol_theme='$mol_theme_calm_light']) [mol_theme='$mol_theme_accent'] {

	--mol_theme_card: oklch(98% 0.03 calc(var(--mol_theme_hue) + 180deg) / 0.25);
}

/* ============================================================
   RADIUS PRESETS
   ============================================================ */
[bog_builderui_radius="none"] { --bog_builderui_radius: 0; }

[bog_builderui_radius="medium"] { --bog_builderui_radius: 0.5rem; }
[bog_builderui_radius="large"] { --bog_builderui_radius: 1rem; }

/* ============================================================
   BODY FONT
   ============================================================ */
[bog_builderui_font_body="inter"] { --bog_builderui_font_body: 'Inter', system-ui, sans-serif; }
[bog_builderui_font_body="manrope"] { --bog_builderui_font_body: 'Manrope', system-ui, sans-serif; }
[bog_builderui_font_body="dm-sans"] { --bog_builderui_font_body: 'DM Sans', system-ui, sans-serif; }
[bog_builderui_font_body="eb-garamond"] { --bog_builderui_font_body: 'EB Garamond', Georgia, serif; }

/* ============================================================
   HEADING FONT
   ============================================================ */
[bog_builderui_font_head="inter"] { --bog_builderui_font_head: 'Inter', system-ui, sans-serif; }
[bog_builderui_font_head="manrope"] { --bog_builderui_font_head: 'Manrope', system-ui, sans-serif; }
[bog_builderui_font_head="dm-sans"] { --bog_builderui_font_head: 'DM Sans', system-ui, sans-serif; }
[bog_builderui_font_head="eb-garamond"] { --bog_builderui_font_head: 'EB Garamond', Georgia, serif; }

/* ============================================================
   BASE COLORS (neutral palette)
   Vars: back, card, field, text, shade, line, hover
   ============================================================ */

/* === Slate (default) === */
:root,
[bog_builderui_base="slate"][bog_builderui_lights="dark"] {
	--bog_builderui_back: #020817;
	--bog_builderui_card: #0f172a;
	--bog_builderui_field: #1e293b;
	--bog_builderui_text: #f8fafc;
	--bog_builderui_shade: #94a3b8;
	--bog_builderui_line: #1e293b;
	--bog_builderui_hover: #ffffff0d;
}
[bog_builderui_base="slate"][bog_builderui_lights="light"] {
	--bog_builderui_back: #ffffff;

	--bog_builderui_field: #f1f5f9;
	--bog_builderui_text: #0f172a;
	--bog_builderui_shade: #64748b;
	--bog_builderui_line: #e2e8f0;
	--bog_builderui_hover: #0000000a;
}

/* === Stone === */
[bog_builderui_base="stone"][bog_builderui_lights="dark"] {
	--bog_builderui_back: #0c0a09;
	--bog_builderui_card: #1c1917;
	--bog_builderui_field: #292524;
	--bog_builderui_text: #fafaf9;
	--bog_builderui_shade: #a8a29e;
	--bog_builderui_line: #292524;
	--bog_builderui_hover: #ffffff0d;
}
[bog_builderui_base="stone"][bog_builderui_lights="light"] {
	--bog_builderui_back: #fafaf9;
	--bog_builderui_card: #ffffff;
	--bog_builderui_field: #f5f5f4;
	--bog_builderui_text: #0c0a09;
	--bog_builderui_shade: #78716c;
	--bog_builderui_line: #e7e5e4;
	--bog_builderui_hover: #0000000a;
}

/* === Zinc === */
[bog_builderui_base="zinc"][bog_builderui_lights="dark"] {
	--bog_builderui_back: #09090b;
	--bog_builderui_card: #18181b;
	--bog_builderui_field: #27272a;
	--bog_builderui_text: #fafafa;
	--bog_builderui_shade: #a1a1aa;
	--bog_builderui_line: #27272a;
	--bog_builderui_hover: #ffffff0d;
}
[bog_builderui_base="zinc"][bog_builderui_lights="light"] {
	--bog_builderui_back: #ffffff;
	--bog_builderui_card: #fafafa;
	--bog_builderui_field: #f4f4f5;
	--bog_builderui_text: #09090b;
	--bog_builderui_shade: #71717a;
	--bog_builderui_line: #e4e4e7;
	--bog_builderui_hover: #0000000a;
}

/* === Gray === */
[bog_builderui_base="gray"][bog_builderui_lights="dark"] {
	--bog_builderui_back: #030712;
	--bog_builderui_card: #111827;
	--bog_builderui_field: #1f2937;

/* ============================================================
   ACCENT THEMES (vars: control, focus, current, special)
   ============================================================ */

:root,
[bog_builderui_theme="sky"] {
	--bog_builderui_control: #0ea5e9;
	--bog_builderui_focus: #38bdf8;
	--bog_builderui_current: #06b6d4;
	--bog_builderui_special: #6366f1;

/* ============================================================
   Bridge to --mol_theme_* so stock $mol components ($mol_chart,
   $mol_button, $mol_string) pick up our palette automatically.
   ============================================================ */
:where([bog_builderui_lights]) {
	--mol_theme_back: var(--bog_builderui_back);
	--mol_theme_card: var(--bog_builderui_card);
	--mol_theme_field: var(--bog_builderui_field);
	--mol_theme_hover: var(--bog_builderui_hover);
	--mol_theme_text: var(--bog_builderui_text);
	--mol_theme_shade: var(--bog_builderui_shade);
	--mol_theme_line: var(--bog_builderui_line);
	--mol_theme_focus: var(--bog_builderui_focus);
	--mol_theme_control: var(--bog_builderui_control);
	--mol_theme_current: var(--bog_builderui_current);
	--mol_theme_special: var(--bog_builderui_special);

/* ============================================================

   ============================================================ */

[bog_builderui_chart="blue"] { --bog_builderui_chart: #3b82f6; }
[bog_builderui_chart="green"] { --bog_builderui_chart: #10b981; }
[bog_builderui_chart="red"] { --bog_builderui_chart: #ef4444; }
[bog_builderui_chart="yellow"] { --bog_builderui_chart: #eab308; }
[bog_builderui_chart="purple"] { --bog_builderui_chart: #a855f7; }

/* ============================================================
   Popover for $bog_builderui_select (style the $mol_pop bubble

   ============================================================ */
[bog_builderui_lights] [mol_pop_bubble],
[bog_builderui_pop] {
	background-color: var(--bog_builderui_card);
	border: 1px solid var(--bog_builderui_line);
	border-radius: var(--bog_builderui_radius);
	box-shadow: 0 10px 30px #00000059;
	padding: 0.375rem;
	gap: 0.125rem;
	min-width: 14rem;
	overflow: hidden;
}

[bog_builderui_lights] [mol_select_filter] {
	display: none;
}

[bog_builderui_lights] [mol_select_option_row] {
	border-radius: calc(var(--bog_builderui_radius) - 2px);
	padding: 0.5rem 0.75rem;
	color: var(--bog_builderui_text);
	font-family: var(--bog_builderui_font_body);
	font-size: 0.9rem;
	background-color: transparent;

[bog_builderui_lights] [mol_select_option_row]:hover {
	background-color: var(--bog_builderui_hover);

[bog_builderui_lights] [mol_select_no_options] {

/* ============================================================

   ============================================================ */

}

[bog_builderui_lights] [mol_view][mol_view_error="Promise"],
[bog_builderui_lights] [mol_view][mol_view_error="$mol_promise_blocker"] {
