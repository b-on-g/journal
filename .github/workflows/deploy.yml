name: $bog_journal_app

permissions: write-all

on:
    workflow_dispatch:
        inputs:
            force:
                description: "Re-render every page, even when the route list has not changed"
                type: boolean
                default: false
    push:
    pull_request:
    delete:

    # Posts are published by flipping a flag in a Land on the master node — no
    # commit, no build. Without a clock the static snapshots would only ever be
    # refreshed by unrelated code pushes, so a new article could stay invisible
    # to crawlers for days.
    #
    # Three hours is the middle of a real trade-off. Faster buys little: a young
    # site is not re-crawled every hour anyway, and each run also pulls Lands
    # from a master node that lives on a memory-starved box. Slower starts to
    # hurt the case this whole pipeline exists for — sharing a fresh link, where
    # the unfurl comes from the static snapshot.
    #
    # Runs with nothing new are nearly free: the prerender action keys its cache
    # on the bundle plus the generated route list, so an unchanged journal
    # restores from cache instead of launching a browser.
    #
    # Minute 17 rather than 0: scheduled runs pile up at the top of the hour and
    # GitHub delays them.
    schedule:
        - cron: "17 */3 * * *"

# Пуш и запуск по расписанию — разные очереди.
#
# Пока группа была общей, а `cancel-in-progress` стоял для всех, прогоны душили
# друг друга: очередной запуск по часам убивал сборку только что запушенного
# коммита, и в прод продолжала уезжать предыдущая версия при внешне зелёной
# истории. Отменять осмысленно только однотипные запуски: новый пуш делает
# ненужным предыдущий, а вот регулярное обновление снапшотов и выкладку кода
# гасить друг об друга нельзя.
concurrency:
    group: deploy-${{ github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        # A hung headless browser would otherwise burn the default six hours,
        # and this workflow now runs eight times a day on its own.
        timeout-minutes: 30

        env:
            BASE_URL: "https://b-on-g.github.io/journal/"
            BUILD_DIR: "bog/journal/app/-"
            SITEMAP: "bog/journal/deploy/sitemap.xml"

        steps:
            - uses: hyoo-ru/mam_build@master2
              with:
                  package: "bog/journal"
                  modules: 'app'

            - name: SPA fallback for deep links
              if: github.ref == 'refs/heads/main'
              run: |
                  # Path routing means /journal/author=…/post=… has no matching file.
                  # GitHub Pages answers such paths with 404.html; its rafgraph redirect
                  # hands the deep-link back to index.html, where the router expands it
                  # into the real pathname.
                  #
                  # Still needed with prerender: snapshots only exist for routes the
                  # discovery step found, and a page dropped as empty (see the verify
                  # step) deliberately falls back to this path.
                  cp bog/journal/404.html bog/journal/app/-/404.html

            # The route list cannot come from the repository: posts live in Lands on
            # the master node, and the prerender action has no crawler of its own —
            # it reads routes from `screens` and from <loc> in a sitemap, nothing else.
            # So the sitemap is produced here, by opening the journals listed in
            # deploy/routes/journals.txt in a real browser and reading their links.
            # Rationale for a browser rather than a node Baza client is in the script.
            - name: Discover published posts
              if: github.ref == 'refs/heads/main'
              continue-on-error: true
              run: |
                  npm install --prefix bog/journal/deploy/routes --no-audit --no-fund
                  NONCE=""
                  if [ "${{ inputs.force }}" = "true" ]; then
                      # Busts the prerender cache when the route list is unchanged but
                      # article bodies were edited.
                      NONCE="--nonce=${{ github.run_id }}"
                  fi
                  node bog/journal/deploy/routes/routes.mjs \
                    --build-dir="$BUILD_DIR" \
                    --base-url="$BASE_URL" \
                    --seeds=bog/journal/deploy/routes/journals.txt \
                    --out="$SITEMAP" \
                    $NONCE

            # Renders every discovered route to <route>/index.html, keeping the scripts
            # so the same file still boots the SPA for a human, and injecting
            # <title>/meta/og/canonical from the app's data-bog-meta.
            #
            # Non-blocking on purpose: a prerender hiccup leaves the plain SPA plus the
            # 404.html fallback, which is exactly how the site worked before.
            # Выключен вместе с переходом на хеш-роутинг: краулер не ходит по
            # `#`-ссылкам, снимать по маршрутам стало нечего. Шаг оставлен, а не
            # удалён — он понадобится, если появится настоящий серверный рендер.
            - name: Prerender routes to static HTML
              if: false
              continue-on-error: true
              uses: b-on-g/mol-prerender-action@main
              with:
                  folder: ${{ env.BUILD_DIR }}
                  base-url: ${{ env.BASE_URL }}
                  route-format: "path"
                  sitemap-file: ${{ env.SITEMAP }}
                  viewport: "1280x900"
                  # Default is 15s. Content here arrives over a CRDT sync from the
                  # master node, not from the bundle, so give the first paint room.
                  timeout: "30000"

            # Rewrites the localhost origin the action bakes into canonical/og:url, and
            # throws away snapshots the Land did not reach in time — an empty static
            # page is worse for search than no page at all.
            #
            # Fails the job on one thing only: a snapshot with no reference to the
            # bundle. That is not a degraded page, it is a static corpse that looks
            # alive and replaces the app for everybody, and it has happened once
            # already. Everything else here stays advisory. A failure here also skips
            # the two steps below, so the previous, working deploy stays up.
            - name: Check and normalize snapshots
              if: github.ref == 'refs/heads/main'
              run: |
                  node bog/journal/deploy/routes/verify.mjs \
                    --build-dir="$BUILD_DIR" \
                    --base-url="$BASE_URL"

            # Draws an og:image for every post that has no cover of its own, right
            # into the snapshot directory the post lives in — the page asks for
            # `<route>/og.png`, so there is no naming scheme to keep in sync.
            #
            # Last before deploy on purpose. It reads the finished snapshots, so it
            # needs the prerender to have run and verify.mjs to have thrown away the
            # snapshots the Land never reached: drawing earlier would leave cards
            # orphaned in directories that are about to be deleted.
            #
            # Its own puppeteer, because the script lives outside deploy/routes and
            # node resolves bare imports upwards from the script, never sideways.
            # The chromium binary is shared through ~/.cache/puppeteer, so the second
            # install costs a few seconds, not a download.
            #
            # Fonts are not installed here: the runner image ships browsers and
            # therefore font packages, and the script checks for a Cyrillic face
            # itself, skipping the cards rather than drawing tofu.
            - name: Draw preview cards
              if: github.ref == 'refs/heads/main'
              continue-on-error: true
              run: |
                  npm install --prefix bog/journal/assets --no-audit --no-fund
                  node bog/journal/assets/og_cards.mjs \
                    --build-dir="$BUILD_DIR" \
                    --base-url="$BASE_URL"

            # Публикация идёт через Actions, а не через ветку gh-pages.
            #
            # Ветка отдавалась встроенному сборщику Pages, и он залип: сборка
            # висела в building больше суток без единой ошибки, принудительный
            # перезапуск не помог. Свежий код при этом в ветке лежал — то есть
            # ломалась именно публикация, на стороне GitHub и мимо нас.
            # Путь через артефакт не зависит от legacy-сборщика.
            - uses: actions/configure-pages@v5
              if: github.ref == 'refs/heads/main'

            - uses: actions/upload-pages-artifact@v3
              if: github.ref == 'refs/heads/main'
              with:
                  path: "bog/journal/app/-"

    deploy:
        needs: build
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
