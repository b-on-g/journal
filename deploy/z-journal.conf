# /etc/nginx/conf.d/z-journal.conf
#
# 🚨 ИМЯ ФАЙЛА. Префикс `z-` обязателен. Конфиги из conf.d подключаются по
# алфавиту, и первый server-блок на данном listen автоматически становится
# default_server. Если этот файл окажется раньше meridian-*.conf, то VLESS-
# клиенты с SNI=<IP> попадут сюда, получат journal-сертификат вместо
# meridian-овского и туннель отвалится с «сертификат недействителен».
# Симптом коварный: `meridian test` при этом проходит.
#
# Пара к этому файлу — SNI-роут в relay-journal.conf, без него :443 не знает,
# куда девать этот домен.

# ---------------------------------------------------------------------------
# :80 — только ACME и редирект. Схема ровно как в z-baza.conf.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name journal.87.120.36.150.ip.giper.dev;
    server_tokens off;

    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------
# Кто бот. Список синхронизирован с crawler_ua из bog/seo/seo.node.ts:1 —
# nginx и $bog_seo должны решать одинаково, иначе бот попадёт на gh-pages
# (получит пустой SPA) либо человек попадёт в $bog_seo (см. ниже, почему это
# плохо кончается).
# ---------------------------------------------------------------------------
map $http_user_agent $journal_bot {
    default 0;
    "~*(Googlebot|bingbot|yandex|baiduspider|Facebot|facebookexternalhit|Twitterbot|rogerbot|linkedinbot|embedly|quora link preview|showyoubot|outbrain|pinterest|slackbot|vkShare|Telegram|Discord|WhatsApp|Applebot|DuckDuckBot|Sogou|ia_archiver|Semrush|AhrefsBot|MJ12bot|DotBot|PetalBot)" 1;
}

# Статика в prerender не идёт никогда. Googlebot исправно тянет web.js, css
# и картинки, чтобы отрисовать страницу самому, и без этой проверки каждый
# такой запрос уходил бы в chromium: рендер JS-файла как веб-страницы, минута
# работы и мусор в кэше, который тут не чистится.
map $uri $journal_asset {
    default 0;
    "~*\.(js|mjs|css|map|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|json|wasm|mp3|mp4|webm)$" 1;
}

# ---------------------------------------------------------------------------
# :8443 — реальный сайт. Слушает только loopback, снаружи на него заводит
# stream-роутер с :443 по SNI.
# ---------------------------------------------------------------------------
server {
    listen 127.0.0.1:8443 ssl;
    http2 on;
    server_name journal.87.120.36.150.ip.giper.dev;
    server_tokens off;

    ssl_certificate     /etc/ssl/journal/fullchain.pem;
    ssl_certificate_key /etc/ssl/journal/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Апстрим для людей — внешний хост, его адрес меняется (Fastly перед
    # GitHub Pages). С литеральным именем в proxy_pass nginx резолвит его
    # один раз при старте и потом годами ходит на протухший IP, поэтому имя
    # вынесено в переменную, а к переменной нужен resolver.
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;
    set $journal_pages "b-on-g.github.io";

    # Корень домена сам по себе ничего не значит: приложение смонтировано в
    # /journal/ (см. README, «Почему в адресе остаётся /journal/»).
    location = / { return 301 https://$host/journal/; }

    # robots/sitemap/llms всегда из $bog_seo, независимо от User-Agent:
    # на gh-pages их просто нет, а sitemap $bog_seo собирает из того, что
    # обошёл краулер.
    location = /robots.txt  { rewrite ^ /__seo/robots.txt  last; }
    location = /sitemap.xml { rewrite ^ /__seo/sitemap.xml last; }
    location = /llms.txt    { rewrite ^ /__seo/llms.txt    last; }

    location / {

        # Развилка. В prerender уходит ровно одно сочетание: бот (1) и не
        # статика (0). Всё остальное идёт на gh-pages.
        #
        # Да, это `if` внутри location — тот самый случай, который
        # документация называет безопасным: только rewrite, ничего больше.
        # Ровно этот приём в официальном сниппете prerender.io. Условия
        # склеены в одну строку потому, что двух `if` подряд nginx не
        # понимает как «и».
        set $journal_route "${journal_bot}${journal_asset}";
        if ( $journal_route = "10" ) {
            rewrite ^(.*)$ /__seo$1 last;
        }

        # Человек идёт прямо на gh-pages, минуя $bog_seo. Так задумано:
        # expressProxy в bog/seo умеет только $node.http.request, то есть
        # plain HTTP, и на https-апстриме отдал бы 502. Люди и не должны
        # ходить через прокси — CDN GitHub быстрее и надёжнее этого VPS.
        proxy_pass https://$journal_pages;
        proxy_ssl_server_name on;
        proxy_ssl_name b-on-g.github.io;
        # Апстрим чужой и ходим к нему через интернет, так что сертификат
        # проверяем. Если nginx поругается на путь к хранилищу CA — на этом
        # хосте он должен быть именно такой, но проверить стоит: строчку
        # можно снять, тогда проверка просто выключится (default off).
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host b-on-g.github.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # gh-pages отвечает 404 + 404.html на любой deep-link, и это нужное
        # поведение: rafgraph-редирект внутри возвращает путь в index.html.
        # Перехватывать такой 404 нельзя.
        proxy_intercept_errors off;
    }

    # Ботовая ветка. internal — снаружи в /__seo не попасть.
    #
    # `^~` на будущее: он говорит nginx не проверять regex-локации, если
    # префикс совпал. Сейчас regex-локаций тут нет, но стоит кому-нибудь
    # добавить `location ~* \.(js|css)$` — и внутренний /__seo/llms.txt
    # уедет мимо прокси, потому что регулярки проверяются раньше префиксов.
    location ^~ /__seo {
        internal;
        rewrite ^/__seo(.*)$ $1 break;

        proxy_pass http://127.0.0.1:3334;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Холодный рендер — это запуск страницы в chromium на половине ядра
        # плюс ожидание синка ленда. Секунды в норме, десятки секунд на
        # холодном контейнере. А /sitemap.xml на пустом кэше запускает обход
        # всего сайта прямо в обработчике запроса (bog/seo вызывает crawl_all
        # синхронно) — это уже минуты. 300s — потолок, за которым что-то
        # точно сломалось.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Отдаём как есть, без промежуточной буферизации: ответ и так
        # генерируется целиком в памяти.
        proxy_buffering off;
    }
}

# ---------------------------------------------------------------------------
# Вариант на будущее — когда появится настоящий домен и журнал пересоберут
# с монтированием роутера в корень ($bog_builderui_router.activate('/')).
# Тогда /journal/ из публичного адреса уходит, а nginx переписывает префикс
# сам:
#
#     location / {
#         set $journal_route "${journal_bot}${journal_asset}";
#         if ( $journal_route = "10" ) { rewrite ^(.*)$ /__seo$1 last; }
#         rewrite ^/(.*)$ /journal/$1 break;
#         proxy_pass https://$journal_pages;
#         …
#     }
#
# и BOG_SEO_UPSTREAM становится https://b-on-g.github.io/journal.
# Раньше пересборки так делать нельзя: в разметке зашит <base href="/journal/">,
# и все относительные ссылки на ассеты уедут в /journal/journal/.
# ---------------------------------------------------------------------------
