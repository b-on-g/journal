services:

  seo:
    build: .
    container_name: bog-journal-seo
    restart: unless-stopped

    # Наружу не торчит: снаружи только nginx на 8443, он же решает,
    # кого сюда пускать. ufw на этом хосте всё равно закрывает всё,
    # кроме 22/80/443, но привязка к loopback дешевле, чем надежда на ufw.
    ports:
      - "127.0.0.1:3334:3334"

    # ---------------------------------------------------------------
    # Потолки. Почему именно такие
    # ---------------------------------------------------------------
    # Хост: 1 ядро, 960 МБ (после апгрейда — 2 ГБ), своп фактически съеден.
    # Рядом живёт run-baza-1 — мастер-нода Гипер Базы, единственная точка
    # отказа сразу для нескольких проектов. Она уже один раз утащила хост
    # в OOM целиком. Поэтому здесь не «с запасом», а жёстко: пусть лучше
    # умрёт прокси для ботов, чем мастер данных.
    #
    # 512 МБ разложены так:
    #   node       ~160 куча (NODE_OPTIONS ниже) + ~60 вне кучи
    #   chromium   ~60 browser + ~150 renderer + ~40 utility/zygote
    #              (--js-flags=--max-old-space-size=128 в chromium-lean.sh)
    # Итого ~470 при худшем раскладе, ~40 МБ на дыхание.
    #
    # Считано на ОДИН открытый таб, и это не допущение: $bog_browser держит
    # браузер синглтоном (@$mol_mem static window()), а страницы открывает и
    # закрывает по одной — параллельного рендера в модуле нет.
    mem_limit: 512m

    # Свопиться этому контейнеру запрещено (memswap_limit == mem_limit).
    # В июле хост убивал не честный OOM-kill, а именно своп-трэшинг:
    # load 16, ssh не отвечает, до OOM-killer дело так и не доходило.
    # Лучше получить kill одного контейнера и запись в логе.
    memswap_limit: 512m

    # Ядро одно на всех, у bog-music-tube уже 0.75. Половины ядра хватает,
    # чтобы отрендерить страницу за единицы секунд, и не хватает, чтобы
    # краулер выжрал CPU у мастер-ноды.
    cpus: 0.5

    # chromium — это дерево процессов с сотнями потоков (browser + zygote +
    # renderer + utility), pids_limit считает задачи, а не процессы. 96, как
    # у tube, ему мало и он просто не стартует. 256 — потолок, выше которого
    # это уже не работа, а размножение.
    pids_limit: 256

    # PID 1 должен собирать зомби. Chromium их плодит при каждом закрытии
    # страницы; без init они копятся и рано или поздно упираются в pids_limit.
    init: true

    # На этом хосте диск однажды забился логами до 93%. 30 МБ на контейнер —
    # потолок, за который история логов прокси не стоит.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:

      BOG_SEO_PORT: "3334"

      # Откуда брать разметку. Путь БЕЗ /journal: $bog_seo склеивает
      # upstream + req.originalUrl, а nginx отдаёт сюда исходный путь
      # (/journal/author=…), не переписывая префикс. Подробнее — README,
      # раздел «Почему в адресе остаётся /journal/».
      BOG_SEO_UPSTREAM: "https://b-on-g.github.io"

      # Fallback-origin для <link rel="canonical"> на страницах, которые не
      # объявили canonical сами.
      # ВНИМАНИЕ: страницы журнала объявляют его сами (post/page/page.view.ts →
      # meta().canonical), а $bog_meta_inject отдаёт приоритет странице, а не
      # этой переменной. То есть по умолчанию она НИ НА ЧТО не влияет, и
      # canonical будет указывать на gh-pages. Это надо чинить в журнале,
      # см. README, раздел «Обязательное условие: canonical».
      BOG_SEO_CANONICAL_BASE: "https://journal.87.120.36.150.ip.giper.dev"

      # Кэш рендеров. TTL 6 часов вместо часа по умолчанию: статья, однажды
      # отрендеренная, меняется редко, а каждый промах кэша стоит запуска
      # страницы в chromium на половине ядра.
      BOG_SEO_CACHE: "true"
      BOG_SEO_CACHE_TTL: "21600000"

      # Краулер на старте выключен. Он ходит по сайту BFS и рендерит каждую
      # страницу; на старте контейнера это ровно тот всплеск CPU и памяти,
      # который здесь нельзя себе позволить, и повторяется он при каждом
      # рестарте. Прогревать — руками, warmup.sh, когда на хосте тихо.
      BOG_SEO_WARMUP: "false"

      # Границы обхода. Это не про скорость, а про память: кэш рендеров в
      # $bog_seo — обычный Map, из которого записи НИКОГДА не удаляются, даже
      # протухшие. 200 страниц × ~80 КБ разметки ≈ 16 МБ и это потолок;
      # дефолтные 1000 дали бы ~80 МБ, то есть шестую часть mem_limit,
      # растущую монотонно до перезапуска.
      BOG_SEO_MAX_DEPTH: "4"
      BOG_SEO_MAX_PAGES: "200"

      # Куча ноды заметно ниже mem_limit — так V8 успевает собрать мусор
      # раньше, чем cgroup пришлёт SIGKILL. Ровно на этом рассинхроне
      # (лимит 600 МБ против --max-old-space-size=1200) в июле умирала база:
      # нода считала, что ей можно вдвое больше, чем разрешал cgroup.
      NODE_OPTIONS: "--max-old-space-size=160"

      TZ: "Europe/Moscow"

    # /robots.txt отдаётся без участия chromium, поэтому проверка дешёвая и
    # при этом честная: ответил — значит express жив. Curl в образе нет, и
    # ставить его ради одного запроса не нужно.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3334/robots.txt',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
