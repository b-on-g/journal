# /etc/nginx/stream.d/relay-maps/journal.conf
#
# Точка расширения SNI-роутера Meridian. На :443 стоит nginx stream со
# ssl_preread, который разводит соединения по SNI; внутрь его map включён
# `include /etc/nginx/stream.d/relay-maps/*.conf`. Свои домены добавляются
# только сюда — файлы самого meridian перезаписываются при каждом его деплое.
#
# Без этой строки journal.87.120.36.150.ip.giper.dev на :443 уедет в
# default-ветку (камуфляж под microsoft.com), и снаружи домен будет отдавать
# чужой сертификат.

journal.87.120.36.150.ip.giper.dev  nginx_https;
